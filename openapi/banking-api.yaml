openapi: 3.1.0
info:
  title: Northstar Banking QA Lab API
  version: 1.0.0
  summary: Accounts, transfers and ledger endpoints for the digital banking QA lab.
  description: |
    A small digital banking API used as the system under test for API, contract,
    UI, database-integrity and performance testing.

    Money is represented as a decimal string with exactly two fraction digits to
    avoid floating-point ambiguity. The lab has no authentication and stores all
    data in memory; it must not be used with real customer data.

    Idempotency: every transfer requires a client-generated `idempotencyKey`.
    Replaying the same key with the same payload returns the original transfer
    with HTTP 200 and `Idempotent-Replayed: true`. Reusing the key with a
    different payload returns HTTP 409.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: QA Automation Lab
    url: https://github.com/
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:3100
    description: Local Playwright/development server
  - url: http://127.0.0.1:3000
    description: Local npm start default
tags:
  - name: Health
    description: Service and database availability.
  - name: Accounts
    description: Customer accounts, balances and ledger history.
  - name: Transfers
    description: Idempotent, atomic account-to-account transfers.
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health
      description: Returns service metadata and confirms the in-memory database responds.
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value:
                    status: ok
                    service: banking-qa-lab
                    version: 1.0.0
                    database: up
                    timestamp: '2026-11-19T06:15:42.278Z'
                    uptimeSeconds: 15
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all accounts
      description: Returns every account with its customer, opening balance and current balance.
      responses:
        '200':
          description: Accounts ordered by ascending id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              examples:
                seeded:
                  value:
                    data:
                      - id: 1
                        accountNumber: QA-1001-USD
                        customer:
                          id: 1
                          fullName: Alice Morgan
                          email: alice.morgan@example.com
                        accountType: CHECKING
                        currency: USD
                        balance: '1000.00'
                        openingBalance: '1000.00'
                        status: ACTIVE
                        createdAt: '2026-11-19T06:15:30.232Z'
                      - id: 2
                        accountNumber: QA-1002-USD
                        customer:
                          id: 2
                          fullName: Ben Okafor
                          email: ben.okafor@example.com
                        accountType: CHECKING
                        currency: USD
                        balance: '250.00'
                        openingBalance: '250.00'
                        status: ACTIVE
                        createdAt: '2026-11-19T06:15:30.243Z'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Open an account
      description: |
        Creates a customer (or reuses the customer with the same email) and an
        account. Used by the load-test setup and by E2E tests to create isolated
        account pairs; the seeded accounts remain untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            examples:
              newAccount:
                value:
                  customerName: Nadia Patel
                  email: nadia.patel@example.com
                  currency: USD
                  openingBalance: '500.00'
                  accountType: SAVINGS
      responses:
        '201':
          description: Account created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Canonical URL of the created account.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: listAccountTransactions
      summary: List an account's ledger entries
      description: Returns debit and credit entries newest first, with the counterparty account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Ledger entries for the account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
              examples:
                debitEntry:
                  value:
                    data:
                      - id: 1
                        transferId: 9f03bb94-dfba-4dca-9965-baa66a0d8f8b
                        accountId: 1
                        type: DEBIT
                        amount: '125.50'
                        currency: USD
                        counterpartyAccountId: 2
                        counterpartyAccountNumber: QA-1002-USD
                        createdAt: '2026-11-19T06:15:52.072Z'
                    meta:
                      accountId: 1
                      accountNumber: QA-1001-USD
                      count: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Create an idempotent transfer
      description: |
        Validates both accounts, currency and available funds, then writes one
        DEBIT and one CREDIT ledger entry and updates both balances atomically.

        Replaying the same `idempotencyKey` with an identical payload returns the
        original transfer and does not move money again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              transfer:
                value:
                  fromAccountId: 1
                  toAccountId: 2
                  amount: '125.50'
                  currency: USD
                  idempotencyKey: 4f4c3c1e-6e0e-4c9c-9f5a-0d2b7a1f9c11
      responses:
        '201':
          description: Transfer completed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Canonical URL of the transfer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
              examples:
                completed:
                  value:
                    data:
                      id: 9f03bb94-dfba-4dca-9965-baa66a0d8f8b
                      idempotencyKey: 4f4c3c1e-6e0e-4c9c-9f5a-0d2b7a1f9c11
                      fromAccountId: 1
                      toAccountId: 2
                      amount: '125.50'
                      currency: USD
                      status: COMPLETED
                      fromAccount:
                        id: 1
                        accountNumber: QA-1001-USD
                      toAccount:
                        id: 2
                        accountNumber: QA-1002-USD
                      createdAt: '2026-11-19T06:15:52.002Z'
        '200':
          description: Idempotent replay of an existing transfer; no money moved.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              description: Present and set to `true` when the response is a replay.
              schema:
                type: string
                enum: ['true']
            Location:
              description: Canonical URL of the original transfer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/transfers/{transferId}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Get one transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Positive integer account identifier.
      schema:
        type: integer
        minimum: 1
    TransferId:
      name: transferId
      in: path
      required: true
      description: Transfer UUID returned by the create-transfer endpoint.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  headers:
    X-Request-Id:
      description: Correlation id echoed from the request or generated by the API.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: The request payload or identifier failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: amount must be greater than 0.
                  details:
                    field: amount
                  requestId: 186ba169-dd6c-4df3-b886-1222e3731f54
    NotFound:
      description: The requested account or transfer does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            account:
              value:
                error:
                  code: ACCOUNT_NOT_FOUND
                  message: Account 999 was not found.
                  details:
                    accountId: 999
                    field: fromAccountId
                  requestId: 70e2664e-b2ca-465d-9497-d5918245b1f0
    Conflict:
      description: A business-state conflict such as an idempotency-key reuse.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            idempotency:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This idempotency key was already used with a different transfer payload.
                  details:
                    idempotencyKey: 4f4c3c1e-6e0e-4c9c-9f5a-0d2b7a1f9c11
                  requestId: 4884cb57-beba-4e3a-a0db-64d5793b93f2
    UnprocessableEntity:
      description: A business rule failed, for example insufficient funds or a currency mismatch.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientFunds:
              value:
                error:
                  code: INSUFFICIENT_FUNDS
                  message: Account 2 has insufficient funds for this transfer.
                  details:
                    accountId: 2
                    balance: '250.00'
                    requestedAmount: '250.01'
                  requestId: 60f9a083-0cfd-44bf-b23d-53571c813f2d
    PayloadTooLarge:
      description: The JSON request body exceeds the 32 KB limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected server error occurred.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred. Please try again later.
                  requestId: 7c4f0d76-0b1c-4f8b-9d4e-9f4f6b2a1c33
  schemas:
    Money:
      type: string
      pattern: '^\d{1,7}\.\d{2}$'
      description: Decimal money string with exactly two fraction digits.
      examples:
        - '25.50'
    Currency:
      type: string
      enum: [USD, EUR, GBP]
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, database, timestamp, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          const: banking-qa-lab
        version:
          type: string
        database:
          type: string
          enum: [up]
        timestamp:
          type: string
          description: ISO-8601 timestamp.
        uptimeSeconds:
          type: integer
          minimum: 0
    Customer:
      type: object
      additionalProperties: false
      required: [id, fullName, email]
      properties:
        id:
          type: integer
          minimum: 1
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 254
    Account:
      type: object
      additionalProperties: false
      required:
        [id, accountNumber, customer, accountType, currency, balance, openingBalance, status, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
        accountNumber:
          type: string
          minLength: 1
          maxLength: 24
        customer:
          $ref: '#/components/schemas/Customer'
        accountType:
          type: string
          enum: [CHECKING, SAVINGS]
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          $ref: '#/components/schemas/Money'
        openingBalance:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
        createdAt:
          type: string
          description: ISO-8601 timestamp.
    AccountList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    AccountResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Account'
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [customerName, email, currency, openingBalance]
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 254
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        currency:
          $ref: '#/components/schemas/Currency'
        openingBalance:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1000000
            - type: string
              pattern: '^\d{1,7}(\.\d{1,2})?$'
        accountType:
          type: string
          enum: [CHECKING, SAVINGS]
          default: CHECKING
    TransferAccountRef:
      type: object
      additionalProperties: false
      required: [id, accountNumber]
      properties:
        id:
          type: integer
          minimum: 1
        accountNumber:
          type: string
          minLength: 1
          maxLength: 24
    TransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amount, currency, idempotencyKey]
      properties:
        fromAccountId:
          type: integer
          minimum: 1
        toAccountId:
          type: integer
          minimum: 1
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              maximum: 1000000
            - type: string
              pattern: '^\d{1,7}(\.\d{1,2})?$'
        currency:
          $ref: '#/components/schemas/Currency'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 80
    Transfer:
      type: object
      additionalProperties: false
      required:
        [id, idempotencyKey, fromAccountId, toAccountId, amount, currency, status, fromAccount, toAccount, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 36
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 80
        fromAccountId:
          type: integer
          minimum: 1
        toAccountId:
          type: integer
          minimum: 1
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum: [COMPLETED, FAILED]
        fromAccount:
          $ref: '#/components/schemas/TransferAccountRef'
        toAccount:
          $ref: '#/components/schemas/TransferAccountRef'
        createdAt:
          type: string
          description: ISO-8601 timestamp.
    TransferResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Transfer'
    Transaction:
      type: object
      additionalProperties: false
      required:
        [id, transferId, accountId, type, amount, currency, counterpartyAccountId, counterpartyAccountNumber, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
        transferId:
          type: string
          minLength: 1
          maxLength: 36
        accountId:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        counterpartyAccountId:
          type: integer
          minimum: 1
        counterpartyAccountNumber:
          type: string
          minLength: 1
          maxLength: 24
        createdAt:
          type: string
          description: ISO-8601 timestamp.
    TransactionList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        meta:
          type: object
          additionalProperties: false
          required: [accountId, accountNumber, count]
          properties:
            accountId:
              type: integer
              minimum: 1
            accountNumber:
              type: string
              minLength: 1
              maxLength: 24
            count:
              type: integer
              minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - SAME_ACCOUNT
                - UNSUPPORTED_CURRENCY
                - ACCOUNT_NOT_FOUND
                - TRANSFER_NOT_FOUND
                - ACCOUNT_NOT_ACTIVE
                - IDEMPOTENCY_CONFLICT
                - INSUFFICIENT_FUNDS
                - CURRENCY_MISMATCH
                - ROUTE_NOT_FOUND
                - PAYLOAD_TOO_LARGE
                - INTERNAL_ERROR
            message:
              type: string
              minLength: 1
            details:
              type: [object, 'null']
              additionalProperties: true
            requestId:
              type: string
              minLength: 1
